spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  mail:
    host: localhost
    port: 1025

languagetool:
  api:
    url: https://api.languagetool.org/v2/check
    key: ${LANGUAGETOOL_API_KEY:}

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY:placeholder-key}

cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT:https://placeholder.r2.cloudflarestorage.com}
    bucket-name: writegy-dev
    access-key: ${R2_ACCESS_KEY:placeholder-key}
    secret-key: ${R2_SECRET_KEY:placeholder-secret}

cors:
  allowed-origins: http://localhost:5173

# JWT Validation Configuration
jwt:
  validation:
    strict: false                   # Allow fallback for development

# OpenRouter AI Configuration
openrouter:
  api:
    key: ${OPENROUTER_API_KEY:}
  model: ${OPENROUTER_MODEL:meta-llama/llama-3.2-3b-instruct:free}
  base:
    url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}

logging:
  level:
    root: INFO
    com.writegy: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

management:
  endpoint:
    health:
      show-details: always

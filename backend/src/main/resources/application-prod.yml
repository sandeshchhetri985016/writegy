server:
  port: ${PORT:8080}

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

  # Add this here! Now ALL profiles will read the .env file
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/writegy}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  cache:
    caffeine:
      spec: maximumSize=100,expireAfterWrite=1h

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL}
          jwk-set-uri: ${SUPABASE_URL}/.well-known/jwk.json

languagetool:
  api:
    key: ${LANGUAGETOOL_API_KEY}

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY:placeholder-key}

cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT}
    bucket-name: writegy-prod
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}

cors:
  allowed-origins: ${FRONTEND_URL}

rate-limit:
  grammar-checks:
    capacity: 20
    refill-duration: 3600

jwt:
  validation:
    strict: true

logging:
  level:
    root: WARN
    com.writegy: INFO

management:
  endpoint:
    health:
      show-details: when-authorized